version: "3.9"  # Docker Compose 文件格式版本

services:
  redis:
    # 使用的 Redis 镜像，基于 Alpine Linux，体积小、安全
    image: redis:8.2.3
    
    # 核心配置：禁止拉取镜像，只使用本地已有镜像
    pull_policy: never

    # 容器名称，方便后续操作
    container_name: redis_go  

    # 重启策略：除非手动停止，否则容器退出后自动重启
    restart: unless-stopped  

    # 端口映射：宿主机 6381 端口映射到容器 6379 端口
    ports:
      - "6381:6379"  

    # 数据卷挂载，实现数据持久化和日志持久化
    volumes:
      # 宿主机 ./redis-data 目录挂载到容器 /data 目录，保存 RDB/AOF 持久化数据
      - ./redis-data:/data  
      # 宿主机 ./redis-log 目录挂载到容器 /var/log/redis 目录，保存日志文件
      - ./redis-log:/var/log/redis  

    # 环境变量（已注释：移除密码相关配置）
    # environment:
    #   # 定义 Redis 密码，在 command 中通过 $REDIS_PASSWORD 引用
    #   REDIS_PASSWORD: "123456"  

    # 容器启动命令：启动 Redis 服务（移除密码认证）
    command: redis-server

# 百万Socket用
    # # 内核参数与资源限制，解决 Redis 常见警告
    # sysctls:
    #   # 解决 "WARNING overcommit_memory" 警告，优化内存分配策略
    #   - net.core.somaxconn=65535  

    # # 进程资源限制
    # ulimits:
    #   # 解除内存锁定限制，避免因内存锁定导致的性能问题
    #   memlock: -1