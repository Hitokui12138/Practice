# 一，全局基本配置
user nginx; # Nginx 用 nginx 用户运行（安全）
worker_processes auto; # 自动根据CPU核心开工作进程（性能最优）
error_log /var/log/nginx/error.log;
pid /run/nginx.pid; # 记录Nginx进程号
include /usr/share/nginx/modules/*.conf; # 加载扩展模块

# 二，连接数配置
events {
    worker_connections 1024; # 每个进程最多同时处理1024个连接
}

# 三，Http全局配置
http {
    # 1. 访问日志
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main; # 访问日志保存路径

    # 2. 文件传输
    sendfile            on;# 高效传输文件（必开）
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;# 连接保持65秒（提升速度）
    types_hash_max_size 4096;
    include             /etc/nginx/mime.types; # 识别文件类型
    default_type        application/octet-stream;

    include /etc/nginx/conf.d/*.conf; # 加载子配置

    # 3.主站
    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  dagejiaolian.com www.dagejiaolian.com _; # 主站绑定域名
        root         /usr/share/nginx/html; # 网站静态文件放在这个目录

        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }

        # 域名验证文件 域名所有权验证文件（SSL 证书 / 百度收录 / 云服务商验证用）
        location = /tN6Fc2OnDo.txt {
            root /usr/share/nginx/html;
            auth_basic off;
            allow all;
            try_files /tN6Fc2OnDo.txt =404;
        }

        # 后台管理接口（访问 你的域名/api/admin/xxx时， nginx转发给 8085 端口）
        location ^~ /api/admin/ {
            proxy_pass http://127.0.0.1:8085/api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 访问 你的域名/api/xxx， nginx转发给 8081 端口）
        location /api/ {
            proxy_pass http://127.0.0.1:8081/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin {
            return 301 /admin/;
        }

        # 访问 dagejiaolian.com/admin/
        location ^~ /admin/ {
            root /usr/share/nginx/html;
            try_files $uri /admin/index.html;
        }
    }

    # ========== WebSocket WSS 专用配置（已放行握手）==========
    server {
        listen       443 ssl http2; # 开启 443 端口（HTTPS/WSS 默认端口）
        listen       [::]:443 ssl http2;
        server_name  ws.skillupsh.com; # 只给 ws.skillupsh.com 这个域名使用

        # 你的SSL证书
        ssl_certificate /etc/nginx/cert/ws.skillupsh.com.pem;
        ssl_certificate_key /etc/nginx/cert/ws.skillupsh.com.key;
        # 加上这三条以兼容浏览器测试
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_conf_command Options UnsafeLegacyRenegotiation;

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        # 放行 WebSocket + 完整透传 token
        location /ws {
            # 访问 wss://ws.skillupsh.com/ws， Nginx 转发到 本地 8081 端口的后端服务
            proxy_pass http://127.0.0.1:8081/ws; 

            # 这三行是websocket固定代码，让 Nginx 识别 WebSocket 并建立长连接。
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";


            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
            proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
            proxy_pass_request_headers on;

            # 超时时间，关闭缓存
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
            proxy_request_buffering off;

        }
    }
}



